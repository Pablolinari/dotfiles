# Hyprland config - equivalente a ~/dotfiles/sway/.config/sway/config
# Referencia: https://wiki.hypr.land/Configuring/

################
### MONITORS ###
################
# Comprueba los nombres reales con:  hyprctl monitors all
# (con NVIDIA puede que el HDMI se llame "HDMI-0" en vez de "HDMI-A-1")
monitor = , preferred, auto, 1
monitor = HDMI-A-1, 2560x1080@60, 0x0, 1
# monitor = HDMI-0, 2560x1080@60, 0x0, 1


#################
### VARIABLES ###
#################
$mod      = SUPER
$terminal = kitty
$menu     = rofi -show drun -theme ~/.config/rofi/launcher.rasi


#####################
### NVIDIA / ENV  ###
#####################
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland


#############
### INPUT ###
#############
input {
    kb_layout  = us
    kb_variant = intl
    follow_mouse = 1
}


#####################
### AUTOSTART     ###
#####################
exec-once = dex -a -e Hyprland                 # XDG autostart (= exec dex --autostart)
exec-once = nm-applet --indicator             # NetworkManager applet
exec-once = swaybg -i ~/dotfiles/wallpaper.png -m fill# fondo de pantalla
exec-once = waybar -c ~/.config/waybar/config-hypr.jsonc -s ~/.config/waybar/style.css
exec-once = [workspace 1 silent] firefox
exec-once = [workspace 2 silent] kitty


#####################
### LOOK & FEEL   ###
#####################
general {
    border_size = 1
    gaps_in  = 0
    gaps_out = 0
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 0
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

animations {
    enabled = false          # Sway no anima; ponlo en true si quieres efectos
}

dwindle {
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    focus_on_activate = true
}


###################
### KEYBINDINGS ###
###################

# --- Lanzadores ---
bind = $mod, Return, exec, $terminal
bind = $mod, D,      exec, $menu
bind = $mod, W,      killactive
bind = $mod, E,      exec, grimshot copy area           # captura de area al portapapeles (igual que en Sway)
bind = $mod, V,      exec, pavucontrol
bind = $mod, G,      exec, firefox --new-window https://gemini.google.com
bind = $mod, S,      exec, spotify
bind = $mod, N,      exec, systemctl suspend
bind = $mod, B,      exec, killall -SIGUSR1 waybar      # ocultar/mostrar waybar
bind = $mod SHIFT, Q, exec, shutdown now

# --- Sesión ---
bind = $mod SHIFT, C, exec, hyprctl reload              # recargar config
bind = $mod SHIFT, R, exec, hyprctl reload && killall -SIGUSR2 waybar && (killall swaybg; swaybg -i ~/dotfiles/wallpaper.png -m fill &)   # recarga Hyprland + waybar + fondo
bind = $mod SHIFT, E, exec, hyprctl dispatch exit       # salir de la sesión

# --- Foco (h/j/k/l + flechas) ---
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r
bind = $mod, Left,  movefocus, l
bind = $mod, Down,  movefocus, d
bind = $mod, Up,    movefocus, u
bind = $mod, Right, movefocus, r

# --- Mover ventana ---
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, J, movewindow, d
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, L, movewindow, r
bind = $mod SHIFT, Left,  movewindow, l
bind = $mod SHIFT, Down,  movewindow, d
bind = $mod SHIFT, Up,    movewindow, u
bind = $mod SHIFT, Right, movewindow, r

# --- Layout ---
bind = $mod, F, fullscreen, 0
bind = $mod, U, layoutmsg, togglesplit                  # (= layout toggle split)
bind = $mod, O, togglegroup                             # tabs/agrupado (~ layout tabbed)
bind = $mod, I, changegroupactive, b                    # (~ layout stacking / ciclar grupo)
bind = $mod SHIFT, V, layoutmsg, togglesplit            # (= split v; dwindle decide orientacion)
bind = $mod SHIFT, Space, togglefloating
bind = $mod, Space, focuscurrentorlast                  # (~ focus mode_toggle)
# bind = $mod, A, ...   # "focus parent" no tiene equivalente directo en dwindle

# --- Redimensionar (no estaba en Sway, pero hace falta): $mod+Ctrl + hjkl ---
bind = $mod CTRL, H, resizeactive, -40 0
bind = $mod CTRL, J, resizeactive, 0 40
bind = $mod CTRL, K, resizeactive, 0 -40
bind = $mod CTRL, L, resizeactive, 40 0

# --- Workspaces ---
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# --- Mover ventana a workspace ---
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# --- Raton: arrastrar / redimensionar flotantes con $mod ---
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# --- Multimedia Spotify (estaban comentados en Sway) ---
# bind = $mod, comma,     exec, playerctl -p spotify previous
# bind = $mod, period,    exec, playerctl -p spotify next
# bind = $mod, semicolon, exec, playerctl -p spotify play-pause


######################
### PORTATIL: TAPA ###
######################
# En un sobremesa no aplica. Equivalente al bindswitch de Sway:
bindl = , switch:on:Lid Switch,  exec, hyprctl keyword monitor "eDP-1, disable"
bindl = , switch:off:Lid Switch, exec, hyprctl keyword monitor "eDP-1, preferred, auto, 1"
