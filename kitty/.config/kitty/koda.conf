# vim:ft=kitty
## name: Koda (dark)
## author: ported from koda.nvim (oskarnurm/koda.nvim) by Claude
## license: MIT
## blurb: minimal grayscale theme with warm-gold accents, matching koda.nvim

# The basic colors
foreground              #b0b0b0
background              #101010
selection_foreground    #ffffff
selection_background    #272727

# Cursor colors
cursor                  #b0b0b0
cursor_text_color       #101010

# URL underline color when hovering with mouse
url_color               #8ebeec

# kitty window border colors
active_border_color     #ffffff
inactive_border_color   #272727
bell_border_color       #d9ba73

# Tab bar colors
active_tab_foreground   #ffffff
active_tab_background   #272727
active_tab_font_style   bold
inactive_tab_foreground #50585d
inactive_tab_background #101010
tab_bar_background      #101010

# black
color0 #272727
color8 #50585d

# red
color1 #ff7676
color9 #ff8f8f

# green
color2  #86cd82
color10 #9fdb9b

# yellow / gold (koda's signature accent)
color3  #d9ba73
color11 #e5cf9c

# blue
color4  #458ee6
color12 #8ebeec

# magenta / pink
color5  #f2a4db
color13 #f7bce4

# cyan
color6  #5abfb5
color14 #7fd3ca

# white
color7  #b0b0b0
color15 #ffffff
